[project]
name = "eye-clinical-analytics"
version = "0.1.0"
description = "Clinical Analysis Core Domain using Local RAG and LLM Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "rq>=1.16.0",          # Lightweight Redis queue for async workers
    "llama-cpp-python>=0.2.56", 
    "qdrant-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mutmut>=2.4.4",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
strict = true

[tool.mutmut]
paths_to_mutate = "src/"
backup = false
runner = "python3 -m pytest tests/ -v"
tests_dir = "tests/"
dict_synonyms = ["Struct", "PydanticModel"]
